<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════
  idea2launch 原型骨架模板 · 第 3 阶段步骤 4 的生成起点
  ════════════════════════════════════════════════════════════════
  用法（执行生成的 LLM 智能体逐条对照；技术约束全文见 prototype-spec.md）：

  【保留】
  1. :root token 块原样保留（本模板取 ui-spec.md §9.1 默认基座；可整块替换为
     §9.2 / §9.3 风格预设，三套变量同名，直接互换，勿删勿改名）；
  2. 语义骨架（header / main 两 section / footer）与 @media 断点结构保留；
  3. data-pid 标注方式保留：格式 页面名-区块名-两位序号，每个可编辑区块一个。

  【替换】
  4. 本文件另存为 <page>.html（页面名小写英文连字符，与 data-pid 页段一致；
     本模板示例页名为 home，换页名时同步替换全部 data-pid 前段）；
  5. 全部「〔替换：…〕」占位换成 PRD 里的真实业务文案（禁 lorem ipsum）；
  6. 区块按页面实际增删：新增可编辑区块必须补 data-pid，序号接续递增；
     需要列表/表单/详情/仪表等结构时，参照 page-design.md 布局库对应骨架。

  【生成后自检】
  7. ui-spec.md §10 十条速查 → review-checklist.md A 至 H ＋三视口截图，
     全过才交用户；断网 file:// 双击核验可打开。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>〔替换：产品名〕 · 〔替换：本页一句话职责〕</title>
<style>
/* ═══ Token 层：整块取自 ui-spec.md §9.1 默认基座（可整块替换为 §9.2 / §9.3，变量同名） ═══ */
:root {
  /* 字体栈：系统字体，零外部请求 */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-heading: var(--font-sans);

  /* 中性灰阶：11 阶蓝灰 */
  --gray-50: #f9fafb;  --gray-100: #f3f4f6;  --gray-200: #e5e7eb;
  --gray-300: #d1d5db; --gray-400: #9ca3af;  --gray-500: #6b7280;
  --gray-600: #4b5563; --gray-700: #374151;  --gray-800: #1f2937;
  --gray-900: #111827; --gray-950: #030712;

  /* 间距：4px 基网格 */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;

  /* 字号阶梯 */
  --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 18px;
  --text-xl: 20px; --text-2xl: 24px; --text-3xl: 30px; --text-4xl: 36px;

  /* 圆角家族：输入框/按钮 md、卡片 lg、浮层 xl */
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --radius-full: 9999px;

  /* 动效 */
  --duration-fast: 150ms; --duration-base: 250ms; --duration-slow: 400ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* 阴影三级（只给真浮动元素） */
  --shadow-1: 0 1px 2px rgba(17, 24, 39, 0.05);
  --shadow-2: 0 4px 12px rgba(17, 24, 39, 0.08);
  --shadow-3: 0 12px 32px rgba(17, 24, 39, 0.14);

  /* 中性语义 */
  --bg-canvas: var(--gray-50);
  --bg-surface: #ffffff;
  --bg-surface-hover: var(--gray-100);
  --text-primary: var(--gray-900);
  --text-secondary: var(--gray-600);
  --text-disabled: var(--gray-400);
  --border-subtle: var(--gray-200);
  --border-strong: var(--gray-400);

  /* 主色（白字对比达正文 AA；替换须复校对比度） */
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-active: #1e40af;
  --primary-fg: #ffffff;

  /* 分层（编辑器浮层引用；全量表见 ui-spec §9.1） */
  --z-sticky: 1020;
}

/* ═══ 基础 ═══ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-md);
  color: var(--text-primary);
  background: var(--bg-canvas);
  line-height: 1.7; /* 中文正文行高 ≥1.7（ui-spec §3） */
}
a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

/* ═══ 顶部导航（扁平选择器，后代嵌套 ≤2 层） ═══ */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
  padding: var(--space-4) var(--space-8);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
}
.brand {
  font-family: var(--font-heading);
  font-size: var(--text-xl);
  font-weight: 700;
  color: var(--primary);
}
.main-nav { display: flex; gap: var(--space-6); }
.main-nav a {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  padding: var(--space-2) 0;
  border-radius: var(--radius-sm);
  transition: color var(--duration-fast) var(--ease-standard);
}
.main-nav a:hover { color: var(--primary); }
.main-nav a:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }

/* ═══ 按钮家族：五态齐全（default/hover/active/focus-visible/disabled，components.md） ═══ */
.btn {
  display: inline-block;
  padding: var(--space-3) var(--space-6);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  font-size: var(--text-md);
  font-weight: 500;
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease-standard);
}
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:active { background: var(--primary-active); }
.btn-primary:focus-visible { outline: 2px solid var(--primary-hover); outline-offset: 2px; }
.btn-primary:disabled { background: var(--gray-300); color: var(--text-disabled); cursor: not-allowed; }

/* ═══ 区块通用 ═══ */
.section { padding: var(--space-12) var(--space-8); }
.section-title {
  font-family: var(--font-heading);
  font-size: var(--text-3xl);
  line-height: 1.3;
  margin-bottom: var(--space-8);
}

/* ═══ Hero：第一屏主张 ═══ */
.hero {
  display: flex;
  align-items: center;
  gap: var(--space-12);
  background: var(--bg-surface);
}
.hero-copy { flex: 1; max-width: 560px; }
.hero-title {
  font-family: var(--font-heading);
  font-size: var(--text-4xl);
  line-height: 1.25;
  margin-bottom: var(--space-4);
}
.hero-sub {
  font-size: var(--text-lg);
  color: var(--text-secondary);
  margin-bottom: var(--space-6);
}
/* 示意图占位块：纯色＋边框；换成真图时用内联 SVG dataURL 的 <img>（禁外链） */
.hero-art {
  flex: 1;
  height: 280px;
  background: var(--bg-canvas);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
}

/* ═══ 卡片区 ═══ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-6);
}
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
}
.card-title { font-size: var(--text-lg); margin-bottom: var(--space-2); }
.card-text { font-size: var(--text-sm); color: var(--text-secondary); }

/* ═══ 页脚 ═══ */
.site-footer {
  padding: var(--space-6) var(--space-8);
  background: var(--gray-900);
  color: var(--gray-200);
  font-size: var(--text-sm);
  text-align: center;
}
.site-footer a { text-decoration: underline; }
.site-footer a:hover,
.site-footer a:focus-visible { color: var(--bg-surface); }

/* ═══ 响应式：≤768px 收为单列（其余断点见 ui-spec §4；三视口必验） ═══ */
@media (max-width: 768px) {
  .site-header { flex-direction: column; padding: var(--space-4); }
  .hero { flex-direction: column; padding: var(--space-8) var(--space-4); text-align: center; }
  .hero-copy { max-width: none; }
  .hero-art { width: 100%; }
  .section { padding: var(--space-8) var(--space-4); }
}
</style>
</head>

  <section class="hero section" data-pid="home-hero-01">
