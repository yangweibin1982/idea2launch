/* ===== Token 层：全部设计变量集中在 :root（V1 Spike 用例原型） ===== */

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--gray-900);
  background: var(--surface);
  line-height: 1.6;
}
img { display: block; max-width: 100%; }
a { text-decoration: none; color: inherit; }

/* ===== 顶部导航 ===== */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-4) var(--space-8);
  border-bottom: 1px solid var(--gray-200);
  background: var(--surface);
}
.brand-mark {
  font-size: 20px;
  font-weight: 700;
  color: var(--brand-500);
}
.main-nav {
  display: flex;
  gap: var(--space-6);
}
.main-nav a {
  color: var(--gray-600);
  font-size: 15px;
  padding: var(--space-2) 0;
}
.main-nav a:hover { color: var(--brand-500); }

/* ===== Hero 区 ===== */
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-8);
  padding: var(--space-12) var(--space-8);
  background: var(--gray-100);
}
.hero-copy { max-width: 520px; }
.hero-title {
  font-size: 40px;
  line-height: 1.25;
  color: var(--gray-900);
  margin-bottom: var(--space-4);
}
.hero-sub {
  font-size: 17px;
  color: var(--gray-600);
  margin-bottom: var(--space-6);
}
.btn-primary {
  display: inline-block;
  background: var(--brand-500);
  color: var(--surface);
  padding: var(--space-4) var(--space-8);
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 600;
}
.btn-primary:hover { background: var(--brand-600); }
.hero-art {
  width: 320px;
  height: 220px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

/* ===== 三卡片区 ===== */
.features {
  padding: var(--space-12) var(--space-8);
}
.features-title {
  text-align: center;
  font-size: 28px;
  margin-bottom: var(--space-8);
  color: var(--gray-900);
}
.card-grid {
  display: flex;
  gap: var(--space-6);
  justify-content: center;
}
.card {
  flex: 1;
  max-width: 300px;
  background: var(--surface);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  box-shadow: var(--shadow-card);
}
.card-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  background: var(--brand-100);
  padding: var(--space-2);
  margin-bottom: var(--space-4);
}
.card-title {
  font-size: 18px;
  margin-bottom: var(--space-2);
  color: var(--gray-900);
}
.card-text {
  font-size: 14px;
  color: var(--gray-600);
}

/* ===== 页脚 ===== */
.site-footer {
  padding: var(--space-6) var(--space-8);
  background: var(--gray-900);
  color: var(--gray-200);
  text-align: center;
  font-size: 14px;
}
.site-footer a { color: var(--accent-400); }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
  .site-header {
    flex-direction: column;
    gap: var(--space-2);
    padding: var(--space-4);
  }
  .hero {
    flex-direction: column;
    text-align: center;
    padding: var(--space-8) var(--space-4);
  }
  .hero-title { font-size: 28px; }
  .hero-art { width: 100%; height: auto; }
  .card-grid {
    flex-direction: column;
    align-items: stretch;
  }
  .card { max-width: none; }
  .features { padding: var(--space-8) var(--space-4); }
}
